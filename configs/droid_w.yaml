    normalize_components: True
    calibration_mismatch_boost:
      enable: False
      weight: 0.10
      min_residual: 0.05
      max_residual: 0.40
      min_risk: 0.00
      max_risk: 0.35
      min_pair_risk_mean: 0.00
      apply_after_gate: False
    reliability_remap:
      enable: False
      mode: smoothstep # smoothstep | sigmoid | linear
      weight: 0.04
      apply_after_gate: False
      min_residual: 0.04
      max_residual: 0.28
      min_risk: 0.00
      max_risk: 0.25
      min_mismatch: 0.02
      max_mismatch: 0.35
      edge_min_mismatch: 0.02
      edge_max_mismatch: 0.10
