    pooling: mean
    min_distance: 0.02
    max_distance: 0.20
    strength: 0.03
    min_scale: 0.97
    max_scale: 1.0
    hard_threshold: null
    hard_scale: 0.95
  token_spatial_suppression:
    enable: False
    max_tokens: 17
    token_dim: 2048
    exclude_camera_token: False
    pooling: mean
    min_distance: 0.02
    max_distance: 0.20
    use_omega_uncertainty: True
    omega_weight: 1.0
    omega_min_uncertainty: 0.78
    omega_max_uncertainty: 1.0
    use_edge_residual: True
