        adaptive_max_strength: 0.006
        residual_min: 0.05
        residual_max: 0.40
        risk_min: 0.0
        risk_max: 0.35
        activation:
          enable: False
          mode: hard # hard | soft
          signal: calibration_mismatch_mean # calibration_mismatch_mean | calibration_mismatch_max | residual_mean | residual_max
          min_signal: 0.05
