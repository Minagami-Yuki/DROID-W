verbose: True
gui: False
stride: 1            # use every X image from the dataset 
max_frames: -1       # use the first X images from the dataset, -1 means using all
setup_seed: 43
fast_mode: True
device: "cuda:0"
save_gt_poses: True
droidvis: False
debug: False

runtime:
  deterministic_eval: False # error on known non-deterministic PyTorch CUDA operations

traj_filler:
  use_dino_features: False

mapping:
  enable: False
  online_plotting: False # render and save images online
  full_resolution: False # if using the full resolution for mapping, but we always keep downsampled size for tracking
  final_refine_iters: 20000 # iterations of final refinement, it will be forced to be 3000 if fast_mode is on
  eval_before_final_ba: True
  deform_gaussians: True # apply transformation on Gaussians to account for loop closure and BA
  pcd_downsample: 32 # downsamples the unprojected depth map --> point cloud
  pcd_downsample_init: 16 # first frame downsampling factor is smaller
  adaptive_pointsize: True
  point_size: 0.05
  Training:
    ssim_loss: True # use SSIM in mapping (online and refinement)
    alpha: 0.5 # weight (between 0 and 1) of the rgb loss compared to depth loss
    init_itr_num: 500
    init_gaussian_update: 100
    init_gaussian_reset: 500
    init_gaussian_th: 0.005
    init_gaussian_extent: 30
    mapping_itr_num: 50
    gaussian_update_every: 1500 # we prune and densify once every 1500 iterations with an offset of 500.
    gaussian_update_offset: 500
    gaussian_th: 0.7 # used in densify and prune - minimum opacity to be kept
    gaussian_extent: 1.0 # used in densify and prune. We prune points with larger 3d scale than 0.1 * gaussian_extent
    gaussian_reset: 20001
    size_threshold: 20 # used in densify and prune. We prune points that have a larger radius than 20 in screen space
    window_size: 10
    edge_threshold: 4
    rgb_boundary_threshold: 0.01
    spherical_harmonics: False # kept for reference, but not tested when True
    lr:
      cam_rot_delta: 0.003
      cam_trans_delta: 0.001
  opt_params:
    position_lr_init: 0.00016
    position_lr_final: 0.0000016
    position_lr_delay_mult: 0.01
    position_lr_max_steps: 30000
    feature_lr: 0.0025
    opacity_lr: 0.05
    scaling_lr: 0.001
    rotation_lr: 0.001
    percent_dense: 0.01
    lambda_dssim: 0.2
    densify_grad_threshold: 0.0002

  model_params:
    sh_degree: 0
    
  pipeline_params:
    convert_SHs_python: False
    compute_cov3D_python: False

  uncertainty_params:
    activate: True
    # If True, use precomputed uncertainties from depth_video (self.video.uncertainties)
    # instead of the MLP network for GS mapping. activate can be False when this is True.
    vis_uncertainty_online: False
    mapping_loss_type: "normalized_l1"
    train_frac_fix: 0.3 # in the range of 0-1
    ssim_window_size: 7
    ssim_median_filter_size: 5
    reg_stride: 2
    opacity_th_for_uncer_loss: 0.9
    uncer_depth_mult: 0.2

tracking:
  focal_calibration:
    enable: False
    solver: alternating # alternating | droidcalib_schur
    intrinsics_mode: focal # focal | full_pinhole (fx, fy, cx, cy)
    # Omega provides the initial K.  Focal mode updates fx/fy with a fixed
    # ratio; full_pinhole additionally updates cx/cy as one shared camera.
    warmup_keyframes: 20
    every_n_ba: 8
    # Optional scene-global calibration freeze.  Null keeps the original
    # continuously-adaptive behavior; a positive value freezes only K.
    freeze_after_keyframes: null
    # Optional K-only observation subset for the joint intrinsics Schur solve.
    # It never changes the ordinary pose/depth BA weights or graph.
    calibration_observation:
      enable: False
      mode: hard # hard (mask) | soft (continuous reweighting)
      min_keyframe_span: 4
      require_omega_uncertainty: True
      omega_max_uncertainty: 0.93
      use_dense_patch_risk: False
      max_dense_patch_risk: 0.25
      soft_omega_certain: 0.85
      soft_omega_uncertain: 1.00
      soft_min_pixel_scale: 0.60
      soft_span_start: 1.0
      soft_span_full: 4.0
      soft_min_edge_scale: 0.75
    use_reliable_weights: True
    min_edges: 12
    min_weighted_pixels: 1024.0
    prior_weight: 20.0
    min_hessian: 0.001
    gn_damping: 0.001
    max_log_step: 0.002
    max_log_deviation: 0.15
    max_loss_increase: 0.0
    principal_point:
      enable: False
      # Limits are in the tracker-resolution coordinates used by DepthVideo.
      max_step: 0.10
      max_deviation: 1.50
      prior_weight: 0.05
      min_hessian: 0.001
    schur_diagnostics: False
    schur_min_hessian: null # disabled unless a positive focal-information threshold is specified
    schur_bootstrap:
      enable: False
      start_keyframes: 30
      end_keyframes: 80
      every_n_ba: 1
      min_hessian: 25.0
      max_log_step: 0.004
      max_log_deviation: 0.10
      trajectory_stability:
        enable: False
        max_translation_update: 0.03
        max_rotation_update_rad: 0.025
        min_consecutive_ba: 3
        reset_after_accept: True
      initial_k_recovery:
        enable: False
        focal_min_px: .inf
        focal_max_px: .inf
      omega_confidence_recovery:
        enable: False
        min_samples: 30
        min_mean_median_ratio: .inf
  pretrained: /home/czy/FanZhu/DROID-Splat/pretrained/droid.pth
  buffer: 350     # maximum number of keyframes that can be stored
  beta: 0.75      # beta * Distance(R|t) + (1-beta) * Distance(I|t), refer to droid_kernels.cu:frame_distance_kernel
  warmup: 12       # use the first X keyframes for bootstrapping the tracker
  max_age: 50     # remove edges in the graph if they have been updated more than X times
  mono_thres: 0.1 # in DSPO, remove the edges if the average disp error of the aligned mono disp is larger than X*average_disp
                  # it can be set to False for keeping all edges.
  motion_filter:
    thresh: 3.0     # add new frame as potential keyframe if avg flow >= X pixels
  multiview_filter:
    thresh: 0.01    # eta in eq(6) of the paper
    visible_num: 2  # points need to be viewed by at least X cameras
  frontend:
    enable_loop: False      # whether to enable loop closure
    enable_online_ba: False # whether to enable online bundle adjustment
    keyframe_thresh: 3.0   # remove keyframe if it is too close to the last keyframe, i.e. avg flow < X pixels
    thresh: 16.0           # only consider edge with avg flow < X pixels
    window: 25             # local ba window size
    radius: 2              # build edges within local window [i-radius, i]
    nms: 1                 # r_local in GO-SLAM paper
    max_factors: 75        # maximum number of edges in local ba
    enable_opt_dyn_mask: True # whether to enable dynamic mask optimization
  backend:
    final_ba: True # whether to enable final global bundle adjustment in the end
    ba_freq: 20    # do online bundle adjustment every X keyframes
    thresh: 25.0   # only consider edge with avg flow < X pixels
    radius: 1      # build edges within local window [i-radius, i]
    nms: 5         # r_global in GO-SLAM paper
    # used for loop detection
    loop_window: 25    # N_local in GO-SLAM paper
    loop_thresh: 25.0  # only consider edge with avg flow < X pixels
    loop_radius: 1     # build edges within local window [i-radius, i]
    loop_nms: 10       # r_loop in GO-SLAM paper
    # Don't set {metric_depth_reg} to False unless you want to do some ablation study
    # If it's False, the depth for mapping will be processed following how Splat-SLAM correct scale.
    #                See "get_w2c_and_depth" in mapper.py for detail.
    metric_depth_reg: True # whether to use metric depth to guide disparity in BA, always set to True
    normalize: False    # whether to normalize disps after each BA iter
  uncertainty_params:
    feature_dim: 384
    activate: True
    visualize: True
    gamma_data: 0.1
    gamma_prior: 0.05
    gamma_depth: 0.001 # default 0.001
    lr: 0.1
    weight_decay: 0.002
    gba_lr: 0.1
    gba_weight_decay: 0.002
    enable_affine_transform: True
    enable_bidirectional_uncer: False
    
  force_keyframe_every_n_frames: 9 # set to negative value if you don't want to force to insert keyframes
  nb_ref_frame_metric_depth_filtering: 6 # number of reference frames for filtering high uncertainty metric depth points

cam:
  ### target/output camera settings, camera_size -> resize -> crop -> target_size
  ### original camera parameters
  H: 720
  W: 1280
  fx: 643.2550048828125
  fy: 642.450927734375
  cx: 651.057373046875
  cy: 364.04974365234375
  png_depth_scale: 5000 #for depth image in png format
  ### target/output camera settings, camera_size -> resize -> crop -> target_size
  H_edge: 0
  W_edge: 0
  H_out: 360
  W_out: 640

mono_prior:
  depth: 'metric3d_vit_large'
  save_depth: False
  feature_extractor: 'dinov2_reg_small_fine' 
  save_feature: False

omega_prior:
  enable: False
  source: cache # cache | model | auto
  cache_dir: null
  cache:
    write: False
    output_dir: null
    overwrite: False
    save_depth: True
    save_confidence: True
    save_uncertainty: True
    save_tokens: True
    save_patch_tokens: True
  missing_policy: warn # warn | ignore | error
  depth:
    enable: False
    mode: replace # replace | blend
    blend_alpha: 1.0
    align_to_mono: none # none | scale, only used by blend mode
    align_trim: 0.05
    align_min_pixels: 256
    align_min_scale: 0.2
    align_max_scale: 5.0
    fallback_to_mono: True
    scale: 1.0
    min_depth: 0.0001
    max_depth: null
  uncertainty:
    enable: False
    apply_to: edge_weight # edge_weight | droid_uncertainty | none
    normalize_confidence: True
    min_confidence: 0.0
    certain_value: 0.78
    uncertain_value: 1.0
    min_value: 0.1
    max_value: 10.0
    missing_value: 1.0
    droid_scale: 45.0
    droid_shift: 35.0
    droid_min_scale: 0.1
    edge_weight_strength: 1.0
    edge_weight_power: 1.0
    min_edge_weight: 0.0
    max_edge_weight: 1.0
    write_to_droid_uncertainty: False
    freeze_droid_uncertainty_update: False
  visualization:
    enable: False
    interval: 100
    save_first: True
    output_dir: null
    colormap: magma
    min_value: null
    max_value: null
    save_raw_npy: False
  model:
    repo_path: thirdparty/vggt-omega
    checkpoint: /data1/czy/Output/DROID-omega/vggt_omega_1b_512.pt
    image_resolution: 512
    preprocess_mode: balanced # balanced | max_size
    patch_size: 16
    device: null
    patch_tokens:
      enable: False
      dim: 8
      projection: group_mean # group_mean | first
      normalize: True

