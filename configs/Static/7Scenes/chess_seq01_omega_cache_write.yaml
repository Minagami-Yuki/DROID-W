inherit_from: ./configs/Static/7Scenes/chess_seq01.yaml
scene: chess_seq01_omega_cache_write

omega_prior:
  enable: True
  source: model
  cache_dir: /data1/czy/Output/DROID-omega/cache/7Scenes/chess_seq01
  cache:
    write: True
    output_dir: /data1/czy/Output/DROID-omega/cache/7Scenes/chess_seq01
    overwrite: False
    save_depth: True
    save_confidence: True
    save_uncertainty: True
    save_tokens: True
    save_patch_tokens: True
  depth:
    enable: False
  uncertainty:
    enable: False
  model:
    repo_path: thirdparty/vggt-omega
    checkpoint: /data1/czy/Output/DROID-omega/vggt_omega_1b_512.pt
    image_resolution: 512
    preprocess_mode: balanced
    patch_size: 16
    patch_tokens:
      enable: True
      dim: 8
      projection: group_mean
      normalize: True
