inherit_from: ./configs/Dynamic/Bonn/bonn_crowd2_omega_token_suppression.yaml
scene: bonn_crowd2_omega_covariance_v1

edge_dtf_prior:
  per_edge_covariance:
    enable: True
    max_tokens: 17
    token_dim: 2048
    exclude_camera_token: False
    pooling: mean
    min_distance: 0.02
    max_distance: 0.20
    use_token_distance: True
    token_weight: 1.0
    use_omega_uncertainty: True
    omega_weight: 1.0
    omega_min_uncertainty: 0.78
    omega_max_uncertainty: 1.0
    use_edge_residual: True
    edge_weight: 0.5
    normalize_components: True
    strength: 0.04
    min_scale: 0.96
    max_scale: 1.0
