inherit_from: ./configs/Dynamic/Bonn/bonn_person_tracking_omega_token_suppression_cache.yaml
scene: bonn_person_tracking_omega_patch_token_uncertainty

omega_prior:
  model:
    patch_tokens:
      enable: True
      dim: 8
      projection: group_mean
      normalize: True

edge_dtf_prior:
  patch_token_uncertainty:
    enable: True
    token_dim: 8
    min_distance: 0.05
    max_distance: 0.60
    strength: 0.01
    min_scale: 0.99
    max_scale: 1.0
    combine_with_omega_uncertainty: True
    omega_weight: 0.25
    omega_min_uncertainty: 0.78
    omega_max_uncertainty: 1.0
    combine_with_edge_residual: False
    edge_weight: 0.25
    normalize_components: True
